{% extends "admin/base.html" %}
{% block title %}{{ title }} | Jenga{% endblock %}
{% block branding %}<h1 id="site-name"><a href="{% url 'admin-workspace' %}">jenga. <span style="font-size:.8em">Administration</span></a></h1>{% endblock %}
{% block extrastyle %}{{ block.super }}
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
html[data-theme="light"],:root{--primary:#245fc5;--secondary:#142e52;--accent:#fff;--body-bg:#f5f7fb;--body-fg:#182b49;--header-color:#fff;--header-branding-color:#fff;--link-fg:#194a9c}
body,input,button,select,textarea{font-family:Poppins,"Segoe UI",sans-serif}#header{background:linear-gradient(110deg,#142e52,#245fc5)}.login #container{border-radius:18px;box-shadow:0 4px 20px rgb(20 46 82 / 8%);overflow:hidden}.login #content{padding:24px}.login input[type=text],.login input[type=password]{border-radius:10px;padding:10px}.button,input[type=submit]{border-radius:10px}#nav-sidebar{display:none!important}.main.shifted>.content{margin-left:0!important}
</style>
{% endblock %}
{% block nav-sidebar %}{% endblock %}
