<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jenga — Saving check-ins</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f8fc;
      --card: #ffffff;
      --ink: #10233f;
      --muted: #64748b;
      --line: #dbe5f0;
      --accent: #1769e0;
      --accent-dark: #0d4eae;
      --ok: #1f7a4d;
      --err: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Poppins", "Segoe UI", sans-serif;
      background: linear-gradient(145deg, #f8fbff 0%, var(--bg) 55%, #eaf3ff 100%);
      color: var(--ink);
    }
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 1.25rem 3rem;
    }
    h1 { margin: 0 0 0.35rem; font-size: 1.75rem; }
    .lead { color: var(--muted); margin: 0 0 1.25rem; }
    a { color: var(--accent-dark); }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 1.25rem;
      box-shadow: 0 18px 45px rgba(21, 66, 122, 0.09);
      margin-bottom: 0.85rem;
    }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin: 0.85rem 0 0.35rem; }
    input, textarea {
      width: 100%;
      padding: 0.7rem 0.75rem;
      border: 1px solid var(--line);
      border-radius: 10px;
      font: inherit;
      background: white;
    }
    button[type="submit"] {
      width: 100%;
      margin-top: 0.85rem;
      padding: 0.75rem;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: white;
      font-weight: 700;
      cursor: pointer;
    }
    .ghost {
      border: 1px solid var(--line);
      background: white;
      color: var(--ink);
    }
    .form-actions { display: flex; gap: 0.6rem; }
    .form-actions button { flex: 1; }
    .msg { margin-top: 1rem; padding: 0.75rem 0.85rem; border-radius: 10px; display: none; white-space: pre-wrap; }
    .msg.show { display: block; }
    .msg.ok { background: #e8f6ee; color: var(--ok); }
    .msg.err { background: #fdecea; color: var(--err); }
    .empty { color: var(--muted); }
    .title { margin: 0 0 0.35rem; font-weight: 700; }
    .meta { margin: 0 0 0.75rem; color: var(--muted); font-size: 0.85rem; }
    .page-nav { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin: 0 calc(50% - 50vw) 2.5rem; padding: 1rem max(1.25rem, calc((100vw - 760px) / 2 + 1.25rem)); background: linear-gradient(105deg, #1c62bb, #164889); }
    .brand { color: white; font-size: 1.3rem; font-weight: 900; letter-spacing: -0.04em; text-decoration: none; }
    .brand span { color: #bfe3ff; }
    .page-nav a { color: rgba(255,255,255,0.88); font-weight: 700; text-decoration: none; }
    .page-nav .nav-links { display: flex; align-items: center; gap: 1rem; }
    .page-nav .nav-icon { display: none; }
    .logout-icon { display: inline-flex; width: 1.2rem; height: 1.2rem; line-height: 1; }
    .logout-icon svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 2; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    .logout-button { border: 1px solid rgba(255,255,255,0.55); border-radius: 8px; background: transparent; color: white; cursor: pointer; font: inherit; font-size: 0.8rem; font-weight: 800; padding: 0.55rem 0.8rem; }
    .menu-toggle { display: none; border: 1px solid rgba(255,255,255,0.55); border-radius: 8px; background: transparent; color: white; cursor: pointer; font-size: 1.25rem; line-height: 1; padding: 0.45rem 0.6rem; }
    @media (min-width: 561px) { .menu-toggle { display: none !important; } }
    @media (max-width: 560px) { body { padding-bottom: 3rem; } .page-nav { position: relative; right: auto; bottom: auto; left: auto; margin: 0 calc(50% - 50vw) 2rem; padding: 0.8rem 1.25rem; } .page-nav .brand { display: block; } .page-nav .menu-toggle { display: block; } .page-nav .nav-links { display: none; position: absolute; z-index: 12; top: 100%; right: 1rem; left: 1rem; padding: 0.5rem; border-radius: 10px; background: #164889; box-shadow: 0 14px 30px rgba(12, 35, 66, 0.2); } .page-nav.menu-open .nav-links { display: flex; flex-direction: column; align-items: stretch; gap: 0.15rem; } .page-nav .nav-links a, .page-nav .logout-button { display: block; width: 100%; height: auto; padding: 0.75rem; border: 0; border-radius: 0; background: transparent; color: white; font-size: 0.8rem; text-align: left; } .page-nav .nav-icon { display: none; } .page-nav .logout-icon { display: inline-flex; } }
    button, input, textarea { font-family: inherit; }
    h1, h2, h3 { font-weight: 600; }
    button, .page-nav a, .title { font-weight: 500; }
    @media (max-width: 560px) { body { padding-bottom: 5.5rem; } .page-nav { position: fixed; z-index: 10; right: 0; bottom: 0; left: 0; align-items: stretch; justify-content: center; margin: 0; padding: 0.65rem 0.75rem; border-top: 1px solid rgba(255,255,255,0.2); background: #164889; box-shadow: 0 -10px 30px rgba(21, 66, 122, 0.18); } .page-nav .brand { display: none; } .page-nav .nav-links { width: 100%; justify-content: space-around; } .page-nav .nav-links a { display: inline-flex; flex: 1; flex-direction: column; align-items: center; gap: 0.3rem; color: rgba(255,255,255,0.88); font-size: 0.63rem; } .page-nav .nav-links a:first-child { color: white; } .page-nav .nav-icon { display: block; font-size: 1.15rem; line-height: 1; } .page-nav .logout-button { display: inline-flex; flex: 1; width: auto; height: auto; flex-direction: column; align-items: center; gap: 0.3rem; border: 0; background: transparent; color: white; font-size: 0.63rem; padding: 0; } }
  </style>
</head>
<body>
  <main>
    <nav class="page-nav" aria-label="Signed-in navigation">
      <a class="brand" href="/">jenga<span>.</span></a>
      <button type="button" class="menu-toggle" id="page-menu-toggle" aria-expanded="false" aria-controls="page-links">☰</button>
      <div class="nav-links" id="page-links"><a href="/"><span class="nav-icon" aria-hidden="true">⌂</span><span>Dashboard</span></a><a href="/goals/"><span class="nav-icon" aria-hidden="true">☆</span><span>Goals</span></a><a href="/commitments/"><span class="nav-icon" aria-hidden="true">✓</span><span>Commitments</span></a><a href="/how-it-works/"><span class="nav-icon" aria-hidden="true">i</span><span>How it works</span></a><a href="/profile/"><span class="nav-icon" aria-hidden="true">●</span><span>Profile</span></a><button type="button" class="logout-button" id="logout-button" title="Log out" aria-label="Log out"><span class="logout-icon" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg></span><span class="sr-only">Log out</span></button></div>
    </nav>
    <h1 data-i18n="saving_checkins">Saving check-ins</h1>
    <p class="lead" data-i18n="saving_checkins_lead">Confirm what you saved or adjust the target for a due commitment.</p>

    <div id="due-list"></div>
    <p id="due-empty" class="empty hidden" data-i18n="no_checkins_due">No saving check-ins are due.</p>
  </main>

  <script>
    const DASHBOARD_LABELS = {{ dashboard_labels_json|safe }};
    let currentLanguage = "english";
    let accessToken = sessionStorage.getItem("jengaAccessToken") || "";
    let refreshToken = sessionStorage.getItem("jengaRefreshToken") || "";
    const list = document.getElementById("due-list");
    const empty = document.getElementById("due-empty");

    function t(key) {
      const pack = DASHBOARD_LABELS[currentLanguage] || DASHBOARD_LABELS.english || {};
      return pack[key] || (DASHBOARD_LABELS.english || {})[key] || key;
    }

    function applyLabels() {
      document.querySelectorAll("[data-i18n]").forEach((el) => {
        el.textContent = t(el.getAttribute("data-i18n"));
      });
      document.title = "Jenga — " + t("saving_checkins");
    }

    document.getElementById("logout-button").addEventListener("click", () => {
      sessionStorage.removeItem("jengaAccessToken");
      sessionStorage.removeItem("jengaRefreshToken");
      window.location.href = "/";
    });
    document.getElementById("page-menu-toggle").addEventListener("click", (event) => {
      const nav = event.currentTarget.closest(".page-nav");
      const expanded = nav.classList.toggle("menu-open");
      event.currentTarget.setAttribute("aria-expanded", String(expanded));
    });

    function todayLocal() {
      const now = new Date();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");
      return now.getFullYear() + "-" + month + "-" + day;
    }

    function formatAmount(value) {
      return "UGX " + Number(value).toLocaleString("en-UG", { maximumFractionDigits: 0 });
    }

    function fieldErrors(data) {
      if (!data || typeof data !== "object") return t("something_wrong");
      if (data.detail) return typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail);
      return Object.entries(data).map(([key, value]) => {
        const text = Array.isArray(value) ? value.join(" ") : value;
        return key + ": " + text;
      }).join("\n");
    }

    function showCardMessage(card, text, ok) {
      const box = card.querySelector(".msg");
      box.textContent = text;
      box.className = "msg show " + (ok ? "ok" : "err");
    }

    async function refreshAccessToken() {
      if (!refreshToken) return false;
      const response = await fetch("/api/v1/auth/refresh/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ refresh: refreshToken }),
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok || !data.access) return false;
      accessToken = data.access;
      sessionStorage.setItem("jengaAccessToken", accessToken);
      if (data.refresh) {
        refreshToken = data.refresh;
        sessionStorage.setItem("jengaRefreshToken", refreshToken);
      }
      return true;
    }

    async function apiFetch(url, options) {
      const headers = Object.assign(
        { Authorization: "Bearer " + accessToken },
        (options && options.headers) || {}
      );
      let response = await fetch(url, Object.assign({}, options || {}, { headers: headers }));
      if (response.status === 401 && (await refreshAccessToken())) {
        headers.Authorization = "Bearer " + accessToken;
        response = await fetch(url, Object.assign({}, options || {}, { headers: headers }));
      }
      const data = await response.json().catch(() => ({}));
      return { response: response, data: data };
    }

    async function patchCommitment(path, body) {
      return apiFetch("/api/v1/commitments/" + path, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
    }

    function renderDue(items) {
      list.replaceChildren();
      empty.classList.toggle("hidden", items.length > 0);
      if (!items.length) empty.textContent = t("no_checkins_due");
      items.forEach((item) => {
        const card = document.createElement("div");
        card.className = "card";
        const linked = item.goal ? " · " + t("linked_to_goal") : "";
        card.innerHTML =
          '<p class="title">' + t("save_amount").replace("{amount}", formatAmount(item.target_amount)) + '</p>' +
          '<p class="meta">' + t("due_on").replace("{date}", item.period_end) + linked + '</p>' +
          '<form class="confirm-form">' +
            '<label>' + t("amount_saved") + '</label>' +
            '<input name="saved_amount" type="number" min="0" step="0.01" required>' +
            '<button type="submit">' + t("confirm") + '</button>' +
          '</form>' +
          '<form class="adjust-form">' +
            '<label>' + t("new_target") + '</label>' +
            '<input name="new_target_amount" type="number" min="0.01" step="0.01" required>' +
            '<label>' + t("reason") + '</label>' +
            '<textarea name="reason" rows="2" required></textarea>' +
            '<button type="submit" class="ghost">' + t("adjust_target") + '</button>' +
          '</form>' +
          '<div class="msg"></div>';

        card.querySelector(".confirm-form").addEventListener("submit", async (event) => {
          event.preventDefault();
          const { response, data } = await patchCommitment(item.id + "/confirm/", {
            saved_amount: event.target.saved_amount.value,
          });
          if (!response.ok) {
            showCardMessage(card, fieldErrors(data), false);
            return;
          }
          await loadDue();
        });
        card.querySelector(".adjust-form").addEventListener("submit", async (event) => {
          event.preventDefault();
          const { response, data } = await patchCommitment(item.id + "/adjust/", {
            new_target_amount: event.target.new_target_amount.value,
            reason: event.target.reason.value.trim(),
          });
          if (!response.ok) {
            showCardMessage(card, fieldErrors(data), false);
            return;
          }
          await loadDue();
        });
        list.append(card);
      });
    }

    async function loadDue() {
      if (!accessToken && !refreshToken) {
        empty.textContent = t("login_to_see_checkins");
        empty.classList.remove("hidden");
        return;
      }
      const { response, data } = await apiFetch("/api/v1/commitments/?status=pending");
      if (!response.ok) {
        empty.textContent = t("could_not_load_checkins");
        empty.classList.remove("hidden");
        return;
      }
      const today = todayLocal();
      const due = (Array.isArray(data) ? data : []).filter((item) => item.period_end < today);
      renderDue(due);
    }

    async function start() {
      if (accessToken || refreshToken) {
        const { response, data } = await apiFetch("/api/v1/profile/");
        if (response.ok) currentLanguage = data.preferred_language || "english";
      }
      applyLabels();
      await loadDue();
    }

    start();
  </script>
</body>
</html>
