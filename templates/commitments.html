<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jenga — Saving check-ins</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 1.25rem 3rem;
    }
    h1 { margin: 0 0 0.35rem; font-size: 1.75rem; }
    .lead { color: var(--muted); margin: 0 0 1.25rem; }
    a { color: var(--accent-dark); }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 1.25rem;
      box-shadow: 0 18px 45px rgba(21, 66, 122, 0.09);
      margin-bottom: 0.85rem;
    }
    button[type="submit"] {
      width: 100%;
      margin-top: 0.85rem;
      padding: 0.75rem;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: white;
      font-weight: 700;
      cursor: pointer;
    }
    .ghost {
      border: 1px solid var(--line);
      background: white;
      color: var(--ink);
    }
    .form-actions { display: flex; gap: 0.6rem; }
    .form-actions button { flex: 1; }
    .msg { margin-top: 1rem; padding: 0.75rem 0.85rem; border-radius: 10px; display: none; white-space: pre-wrap; }
    .msg.show { display: block; }
    .msg.ok { background: #e8f6ee; color: var(--ok); }
    .msg.err { background: #fdecea; color: var(--err); }
    .empty { color: var(--muted); }
    .title { margin: 0 0 0.35rem; font-weight: 700; }
    .meta { margin: 0 0 0.75rem; color: var(--muted); font-size: 0.85rem; }
    h1, h2, h3 { font-weight: 600; }
    .title { font-weight: 500; }
  </style>
  {% include "partials/design_system.html" %}
</head>
<body class="page-commitments">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <main id="main-content" tabindex="-1">
    {% include "partials/navbar.html" %}
    <h1>Saving check-ins</h1>
    <p class="lead">Confirm what you saved or adjust the target for a due commitment.</p>

    <div id="due-list"></div>
    <p id="due-empty" class="empty hidden" data-i18n="no_checkins_due">No saving check-ins are due.</p>
  </main>

  <script>
    const DASHBOARD_LABELS = {{ dashboard_labels_json|safe }};
    let currentLanguage = "english";
    let accessToken = sessionStorage.getItem("jengaAccessToken") || "";
    let refreshToken = sessionStorage.getItem("jengaRefreshToken") || "";
    const list = document.getElementById("due-list");
    const empty = document.getElementById("due-empty");

    function t(key) {
      const pack = DASHBOARD_LABELS[currentLanguage] || DASHBOARD_LABELS.english || {};
      return pack[key] || (DASHBOARD_LABELS.english || {})[key] || key;
    }

    function applyLabels() {
      document.querySelectorAll("[data-i18n]").forEach((el) => {
        el.textContent = t(el.getAttribute("data-i18n"));
      });
      document.title = "Jenga — " + t("saving_checkins");
    }

    document.getElementById("logout-button").addEventListener("click", () => {
      sessionStorage.removeItem("jengaAccessToken");
      sessionStorage.removeItem("jengaRefreshToken");
      window.location.href = "/";
    });
    document.getElementById("page-menu-toggle").addEventListener("click", (event) => {
      const nav = event.currentTarget.closest(".page-nav");
      const expanded = nav.classList.toggle("menu-open");
      event.currentTarget.setAttribute("aria-expanded", String(expanded));
    });

    function todayLocal() {
      const now = new Date();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");
      return now.getFullYear() + "-" + month + "-" + day;
    }

    function formatAmount(value) {
      return "UGX " + Number(value).toLocaleString("en-UG", { maximumFractionDigits: 0 });
    }

    function fieldErrors(data) {
      if (!data || typeof data !== "object") return t("something_wrong");
      if (data.detail) return typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail);
      return Object.entries(data).map(([key, value]) => {
        const text = Array.isArray(value) ? value.join(" ") : value;
        return key + ": " + text;
      }).join("\n");
    }

    function showCardMessage(card, text, ok) {
      const box = card.querySelector(".msg");
      box.textContent = text;
      box.className = "msg show " + (ok ? "ok" : "err");
    }

    async function refreshAccessToken() {
      if (!refreshToken) return false;
      const response = await fetch("/api/v1/auth/refresh/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ refresh: refreshToken }),
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok || !data.access) return false;
      accessToken = data.access;
      sessionStorage.setItem("jengaAccessToken", accessToken);
      if (data.refresh) {
        refreshToken = data.refresh;
        sessionStorage.setItem("jengaRefreshToken", refreshToken);
      }
      return true;
    }

    async function apiFetch(url, options) {
      const headers = Object.assign(
        { Authorization: "Bearer " + accessToken },
        (options && options.headers) || {}
      );
      let response = await fetch(url, Object.assign({}, options || {}, { headers: headers }));
      if (response.status === 401 && (await refreshAccessToken())) {
        headers.Authorization = "Bearer " + accessToken;
        response = await fetch(url, Object.assign({}, options || {}, { headers: headers }));
      }
      const data = await response.json().catch(() => ({}));
      return { response: response, data: data };
    }

    async function patchCommitment(path, body) {
      return apiFetch("/api/v1/commitments/" + path, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
    }

    function renderDue(items) {
      list.replaceChildren();
      empty.classList.toggle("hidden", items.length > 0);
      if (!items.length) empty.textContent = t("no_checkins_due");
      items.forEach((item) => {
        const card = document.createElement("div");
        card.className = "card";
        const linked = item.goal ? " · " + t("linked_to_goal") : "";
        card.innerHTML =
          '<p class="title">' + t("save_amount").replace("{amount}", formatAmount(item.target_amount)) + '</p>' +
          '<p class="meta">' + t("due_on").replace("{date}", item.period_end) + linked + '</p>' +
          '<form class="confirm-form">' +
            '<label>' + t("amount_saved") + '</label>' +
            '<input name="saved_amount" type="number" min="0" step="0.01" required>' +
            '<button type="submit">' + t("confirm") + '</button>' +
          '</form>' +
          '<form class="adjust-form">' +
            '<label>' + t("new_target") + '</label>' +
            '<input name="new_target_amount" type="number" min="0.01" step="0.01" required>' +
            '<label>' + t("reason") + '</label>' +
            '<textarea name="reason" rows="2" required></textarea>' +
            '<button type="submit" class="ghost">' + t("adjust_target") + '</button>' +
          '</form>' +
          '<div class="msg" role="status" aria-live="polite"></div>';

        card.querySelector(".confirm-form").addEventListener("submit", async (event) => {
          event.preventDefault();
          const { response, data } = await patchCommitment(item.id + "/confirm/", {
            saved_amount: event.target.saved_amount.value,
          });
          if (!response.ok) {
            showCardMessage(card, fieldErrors(data), false);
            return;
          }
          await loadDue();
        });
        card.querySelector(".adjust-form").addEventListener("submit", async (event) => {
          event.preventDefault();
          const { response, data } = await patchCommitment(item.id + "/adjust/", {
            new_target_amount: event.target.new_target_amount.value,
            reason: event.target.reason.value.trim(),
          });
          if (!response.ok) {
            showCardMessage(card, fieldErrors(data), false);
            return;
          }
          await loadDue();
        });
        list.append(card);
      });
    }

    async function loadDue() {
      if (!accessToken && !refreshToken) {
        empty.textContent = t("login_to_see_checkins");
        empty.classList.remove("hidden");
        return;
      }
      const { response, data } = await apiFetch("/api/v1/commitments/?status=pending");
      if (!response.ok) {
        empty.textContent = t("could_not_load_checkins");
        empty.classList.remove("hidden");
        return;
      }
      const today = todayLocal();
      const due = (Array.isArray(data) ? data : []).filter((item) => item.period_end < today);
      renderDue(due);
    }

    async function start() {
      if (accessToken || refreshToken) {
        const { response, data } = await apiFetch("/api/v1/profile/");
        if (response.ok) currentLanguage = data.preferred_language || "english";
      }
      applyLabels();
      await loadDue();
    }

    start();
  </script>
  {% include "partials/ui_behaviors.html" %}
</body>
</html>
