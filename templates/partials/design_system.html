{# Shared visual foundations. Page templates own feature layouts; this file owns the UI language. #}
<style>
  :root {

  .msg { line-height: 1.6; border: 1px solid transparent; overflow-wrap: anywhere; }

  .empty { padding: 1.5rem; border: 1px dashed #bdcbdc; border-radius: var(--radius); background: var(--card); color: var(--muted); text-align: center; }

  .goal-meta { gap: 0.5rem; flex-wrap: wrap; }
  .goal-name, .title { overflow-wrap: anywhere; }

  .hero-copy h1 { font-size: clamp(2.6rem, 5vw, 4rem); line-height: 1.12; margin-bottom: 1.25rem; }

  .hero-visual { background: linear-gradient(145deg, var(--navy), var(--accent)); box-shadow: 0 20px 45px rgb(20 46 82 / 14%); }

  }
  @media (prefers-reduced-motion: reduce) {

  }
</style>
