<script>
  const DASHBOARD_LABELS = {{ dashboard_labels_json|safe }};
  const LANGUAGE_HTML = { english: "en", luganda: "lg", runyankole: "nyn", acholi: "ach", ateso: "teo" };
  let currentLanguage = "english";

  function t(key, vars) {
    const pack = DASHBOARD_LABELS[currentLanguage] || DASHBOARD_LABELS.english || {};
    let text = pack[key] || (DASHBOARD_LABELS.english || {})[key] || key;
    if (vars) {
      Object.keys(vars).forEach((name) => {
        text = String(text).split("{" + name + "}").join(String(vars[name]));
      });
    }
    return text;
  }

  function applyLabels() {
    document.documentElement.lang = LANGUAGE_HTML[currentLanguage] || "en";
    document.querySelectorAll("[data-i18n]").forEach((el) => {
      el.textContent = t(el.getAttribute("data-i18n"));
    });
    document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => {
      el.placeholder = t(el.getAttribute("data-i18n-placeholder"));
    });
    document.querySelectorAll("[data-i18n-aria]").forEach((el) => {
      el.setAttribute("aria-label", t(el.getAttribute("data-i18n-aria")));
    });
    document.querySelectorAll("[data-i18n-title]").forEach((el) => {
      document.title = t(el.getAttribute("data-i18n-title"));
    });
    document.querySelectorAll("#goal-type option").forEach((option) => {
      option.textContent = t("goal_type_" + option.value);
    });
    const toggle = document.querySelector(".menu-toggle");
    if (toggle) toggle.setAttribute("aria-label", t("nav_open"));
  }

  function rememberLanguage(code) {
    currentLanguage = String(code || "english").toLowerCase();
    try {
      localStorage.setItem("jengaPreferredLanguage", currentLanguage);
    } catch (exc) {}
  }

  async function loadPreferredLanguage() {
    try {
      const saved = localStorage.getItem("jengaPreferredLanguage");
      if (saved) currentLanguage = saved.toLowerCase();
    } catch (exc) {}
    applyLabels();
    try {
      if (typeof sessionFetch === "function") {
        const response = await sessionFetch("/api/v1/profile/");
        if (response.ok) {
          const data = await response.json();
          rememberLanguage(data.preferred_language || currentLanguage || "english");
        }
      }
    } catch (exc) {}
    applyLabels();
    return currentLanguage;
  }
</script>
